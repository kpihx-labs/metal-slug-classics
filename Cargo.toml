[package]
name = "metal-slug-classics"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
description = "ROM auditor and governed launcher for locally owned Metal Slug sets"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
if-addrs = "0.13"
tempfile = "3.14"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
